[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "operations/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = [".venv", "operations/migrations"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
