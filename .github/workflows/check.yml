name: Foundation checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dpot
          POSTGRES_USER: dpot
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DPOT_POSTGRES: "1"
      PGDATABASE: dpot
      PGUSER: dpot
      PGPASSWORD: ci-only-not-a-secret
      PGHOST: localhost
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy config operations manage.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests_js/pwa.test.cjs tests_js/geolocation.test.cjs tests_js/navigation.test.cjs
