<a class="card stop-card" href="{% url 'delivery-detail' delivery.id %}"><span class="badge {{ delivery.status }}">{{ delivery.get_status_display }}</span><p class="micro muted">{{ delivery.reference }}</p><h2>{{ delivery.recipient_name }}</h2><p>{{ delivery.pickup.area }} → {{ delivery.destination.area }}</p>{% if delivery.window_start %}<p class="small-text amber">{{ delivery.window_start|date:"d M, H:i" }}–{{ delivery.window_end|date:"H:i" }} GMT</p>{% endif %}<span class="text-link">Open delivery →</span></a>
